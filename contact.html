<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>문의하기 | AVORA</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/eunchurn/NanumSquareNeo@0.0.6/nanumsquareneovar.css" />
  <link rel="stylesheet" href="/landing.css" />
  <link rel="stylesheet" href="/pages.css" />
</head>
<body>
  <div class="page page-sub">
    <main class="shell sub-main ">
      <a class="back-link" href="/">← AVORA 홈</a>
      <section class="panel sub-panel">
        <p class="eyebrow">CONTACT</p>
        <h1 class="sub-title">AVORA 도입 문의</h1>
        <div class="sub-body">

          <p class="lead">AI SNS 운영 시스템 도입이 필요하신가요? 활용 목적과 운영 규모를 남겨주시면 빠르게 안내드립니다.</p>
          <form class="contact-form" action="mailto:studio.realday@gmail.com" method="post" enctype="text/plain">
            <label>회사명<input name="company" placeholder="회사명" /></label>
            <label>회사 규모
              <select name="size" required>
                <option value="">회사 규모를 선택해주세요</option>
                <option>1-10명</option>
                <option>11-50명</option>
                <option>51-200명</option>
                <option>201-500명</option>
                <option>500명 이상</option>
              </select>
            </label>
            <label>이메일 *<input name="email" type="email" required placeholder="you@company.com" /></label>
            <label>전화번호<input name="phone" placeholder="010-0000-0000" /></label>
            <label class="full">문의 내용 *<textarea name="message" required placeholder="도입 목적, 채널 수, 희망 일정 등을 알려주세요."></textarea></label>
            <button class="btn-primary" type="submit">문의 보내기</button>
          </form>

        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="shell footer-grid">
        <div class="footer-info">
          <div><span class="label">사업자명</span><span class="sep">|</span><span>리얼데이</span></div>
          <div><span class="label">대표</span><span class="sep">|</span><span>이지수</span></div>
          <div><span class="label">사업자번호</span><span class="sep">|</span><span>146-11-03027</span></div>
          <div><span class="label">이메일</span><span class="sep">|</span><span>studio.realday@gmail.com</span></div>
          <div class="footer-links">
            <a href="/privacy.html">AVORA 개인정보처리방침</a>
            <a href="/terms.html">AVORA 이용약관</a>
            <a href="/content-policy.html">콘텐츠 운영정책</a>
            <a href="/api-reference.html">API 레퍼런스</a>
            <a href="/contact.html">문의하기</a>
          </div>
          <div class="copyright">© 2026 리얼데이</div>
        </div>
        <div class="footer-brand">
          <img src="/assets/brand/avora-logo.png" alt="AVORA 로고" class="logo logo-md" />
          <p>브랜드가 사람이 되는 순간</p>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
