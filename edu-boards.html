<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>워크스페이스 · 아보라Edu</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/eunchurn/NanumSquareNeo@0.0.6/nanumsquareneovar.css" />
  <link rel="stylesheet" href="edu.css" />
</head>
<body>
  <div class="page page-boards">
    <header class="site-header">
      <div class="shell header-grid">
        <a class="brand" href="edu.html">
          <img src="assets/edu/avora-logo.png" alt="AVORA" class="brand-logo" />
          <span class="brand-edu">Edu</span>
        </a>
        <nav class="nav-actions">
          <a class="btn" href="edu.html">랜딩</a>
          <a class="btn btn-brand" href="edu-workspace.html?board=new">새 보드</a>
        </nav>
      </div>
    </header>

    <main class="section shell boards-main">
      <div class="section-head">
        <div>
          <p class="eyebrow">Workspace</p>
          <h1 class="boards-title">최근 보드</h1>
        </div>
        <span>팀 스페이스 · 시나리오</span>
      </div>

      <div class="board-grid">
        <a class="board-card board-card-new" href="edu-workspace.html?board=new">
          <div class="board-thumb board-thumb-new">
            <span>+</span>
            <b>새 시나리오</b>
          </div>
        </a>

        <a class="board-card" href="edu-workspace.html?board=photo">
          <div class="board-thumb">
            <img src="assets/edu/blank.svg" alt="" />
            <img src="assets/edu/blank.svg" alt="" />
            <img src="assets/edu/blank.svg" alt="" />
          </div>
          <div class="board-body">
            <h3>광합성 실험 가이드</h3>
            <div class="board-meta">
              <span>샷 3 · 오늘</span>
              <span class="avatars"><span class="a-purple">지</span><span class="a-cyan">민</span><span class="a-amber">하</span></span>
            </div>
          </div>
        </a>

        <a class="board-card" href="edu-workspace.html?board=campus">
          <div class="board-thumb">
            <img src="assets/edu/blank.svg" alt="" />
            <img src="assets/edu/blank.svg" alt="" />
          </div>
          <div class="board-body">
            <h3>캠퍼스 오리엔테이션</h3>
            <div class="board-meta">
              <span>샷 6 · 어제</span>
              <span class="avatars"><span class="a-rose">유</span><span class="a-purple">지</span></span>
            </div>
          </div>
        </a>

        <a class="board-card" href="edu-workspace.html?board=sejong">
          <div class="board-thumb">
            <img src="assets/edu/blank.svg" alt="" />
            <img src="assets/edu/blank.svg" alt="" />
            <img src="assets/edu/blank.svg" alt="" />
          </div>
          <div class="board-body">
            <h3>세종, 한글을 만들다</h3>
            <div class="board-meta">
              <span>샷 8 · 3일 전</span>
              <span class="avatars"><span class="a-amber">하</span><span class="a-cyan">민</span></span>
            </div>
          </div>
        </a>

        <a class="board-card" href="edu-workspace.html?board=math">
          <div class="board-thumb">
            <img src="assets/edu/blank.svg" alt="" />
          </div>
          <div class="board-body">
            <h3>분수 개념 3분 컷</h3>
            <div class="board-meta">
              <span>샷 4 · 초안</span>
              <span class="avatars"><span class="a-cyan">민</span></span>
            </div>
          </div>
        </a>

        <a class="board-card" href="edu-workspace.html?board=water">
          <div class="board-thumb">
            <img src="assets/edu/blank.svg" alt="" />
            <img src="assets/edu/blank.svg" alt="" />
          </div>
          <div class="board-body">
            <h3>물의 순환</h3>
            <div class="board-meta">
              <span>샷 5 · 지난주</span>
              <span class="avatars"><span class="a-purple">지</span><span class="a-amber">하</span></span>
            </div>
          </div>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
